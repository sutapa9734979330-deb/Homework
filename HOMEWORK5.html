<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="add"></p>
    <p id="min"></p>
    <p id="mul"></p>
    <p id="div"></p>

    <script>
       var a , b;
       a = 10;
       b = 5;
       var sum=a+b;
       var min=a-b;
       var mul=a*b;
       var x=a/b;
       document.getElementById("add").innerHTML = "10 + 5 = " + sum + ".";
       document.getElementById("min").innerHTML = "10 - 5 = " + min + ".";
       document.getElementById("mul").innerHTML = "10 * 5 = " + mul + ".";
       document.getElementById("div").innerHTML = "10 / 5 = " + x + ".";
    </script>
</body>
</html>
